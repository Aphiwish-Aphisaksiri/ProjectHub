services:
  projecthub:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    develop:
      watch:
        - action: sync
          path: ./
          target: /app
          ignore:
            - node_modules
            - .next
            - .git
        - action: rebuild
          path: ./package.json
    command: npm run dev