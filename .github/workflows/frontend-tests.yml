name: Frontend Tests

on:
  push:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test